<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIIT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Minuteur HIIT</title>
<style>
:root {
  --fond: #0f1216;
  --carte: #1a1f26;
  --trait: #2a313b;
  --appui: #3a4350;
  --texte: #f2f4f7;
  --doux: #9aa4b2;
  --precycle: #f2b134;
  --effort: #d7263d;
  --repos: #1e8c5a;
  --entre: #2463b4;
  --fin: #5b3fb0;
  --vert: #1fa463;
}
* { box-sizing: border-box; }
html {
  background: var(--fond);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: manipulation;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--fond);
  color: var(--texte);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  margin: 0;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
[hidden] { display: none !important; }

/* ---------- Réglages ---------- */
#reglages {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
           0 calc(env(safe-area-inset-left) + 16px);
}
/* « Démarrer » reste visible en bas de l'écran, même quand les réglages dépassent. */
.pied {
  position: sticky; bottom: 0; margin: 0 -16px;
  padding: 18px 16px calc(env(safe-area-inset-bottom) + 14px);
  background: linear-gradient(to bottom, rgba(15, 18, 22, 0), var(--fond) 18px);
}
h1 { font-size: 30px; line-height: 1.15; margin: 10px 4px 16px; letter-spacing: -0.01em; }
.bloc { background: var(--carte); border-radius: 16px; }
.ligne {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 66px; padding: 8px 10px 8px 16px;
}
.ligne + .ligne { border-top: 1px solid var(--trait); }
.nom { font-weight: 600; line-height: 1.2; }
.nom small { display: block; margin-top: 2px; font-weight: 400; font-size: 14px; color: var(--doux); }
.puce { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
.reglage { display: flex; align-items: center; gap: 4px; flex: none; }
.pas {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--trait); font-size: 28px; line-height: 1; font-weight: 500;
  display: grid; place-items: center; touch-action: none;
}
.pas:active { background: var(--appui); }
.valeur {
  position: relative; display: block; min-width: 76px; padding: 6px 2px; border-radius: 10px;
  text-align: center; font-size: 25px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.valeur:active { background: var(--trait); }
.valeur select {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  opacity: 0; font-size: 16px; -webkit-appearance: none; appearance: none;
}
.resume { margin: 18px 4px 16px; }
#frise { display: block; width: 100%; height: 30px; border-radius: 8px; }
.total { margin: 10px 0 2px; font-size: 19px; }
.total strong { font-variant-numeric: tabular-nums; }
details { font-size: 15px; color: var(--doux); }
summary { padding: 8px 0; color: var(--texte); font-weight: 600; cursor: pointer; }
#detail { margin: 0; padding: 0; list-style: none; }
#detail li { padding: 4px 0; }
#detail b { color: var(--texte); font-weight: 600; }
.son { padding: 14px 16px; margin-bottom: 16px; }
.aide { margin: 0 0 12px; font-size: 14px; color: var(--doux); }
.secondaire { min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--trait); font-weight: 600; }
.secondaire:active { background: var(--appui); }
.gros {
  display: block; width: 100%; min-height: 66px; border-radius: 18px;
  background: var(--vert); color: #fff; font-size: 23px; font-weight: 800; letter-spacing: .02em;
}
.gros:active { filter: brightness(.9); }

/* ---------- Séance ---------- */
#seance {
  position: fixed; inset: 0; overflow: hidden; touch-action: none;
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px);
  background: var(--couleur, var(--fond)); color: var(--encre, #fff);
  transition: background-color .25s;
}
#seance[data-phase="precycle"] { --couleur: var(--precycle); --encre: #1b1400; }
#seance[data-phase="effort"] { --couleur: var(--effort); }
#seance[data-phase="repos"] { --couleur: var(--repos); }
#seance[data-phase="entre"] { --couleur: var(--entre); }
.haut { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.centre { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#phase { font-size: min(9vw, 7vh); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1; }
#seance[data-phase="entre"] #phase { font-size: min(6.6vw, 6vh); }
#chrono {
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: min(40vw, 40vh); font-weight: 800; line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; margin: .04em 0 .06em;
}
#chrono.long { font-size: min(30vw, 34vh); }
#seance.pause #chrono { animation: clignote 1.2s steps(1) infinite; }
@keyframes clignote { 50% { opacity: .3; } }
.barre { width: min(100%, 520px); height: 12px; border-radius: 6px; background: rgba(0, 0, 0, .22); overflow: hidden; }
#barre-phase { height: 100%; background: currentColor; transform-origin: left center; transform: scaleX(0); }
#ensuite { margin-top: 14px; font-size: min(6vw, 4.5vh); font-weight: 700; }
#etat-pause { margin-top: 10px; font-size: 18px; font-weight: 800; letter-spacing: .08em; }
.frise-seance { position: relative; margin: 10px 0 14px; padding: 4px; border-radius: 8px; background: rgba(0, 0, 0, .28); }
#frise-seance { display: block; width: 100%; height: 14px; border-radius: 4px; }
#curseur {
  position: absolute; top: -3px; bottom: -3px; width: 4px; margin-left: -2px;
  left: calc(4px + (100% - 8px) * var(--f, 0));
  border-radius: 2px; background: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .45);
}
#alerte-son { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: rgba(0, 0, 0, .6); color: #fff; text-align: center; font-weight: 700; }
.commandes { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 10px; }
.commandes button { min-height: 68px; border-radius: 18px; background: rgba(0, 0, 0, .24); font-size: 18px; font-weight: 800; }
.commandes button:active { background: rgba(0, 0, 0, .38); }
.commandes .principal { background: rgba(255, 255, 255, .94); color: #111; font-size: 21px; }
.commandes .principal:active { background: #fff; }
#arreter.arme { background: #fff; color: var(--effort); }

@media (orientation: landscape) and (max-height: 560px) {
  #seance { display: grid; grid-template-columns: 1fr minmax(150px, 26vw); grid-template-rows: auto 1fr auto; column-gap: 18px; }
  .haut { grid-column: 1 / -1; }
  .centre { grid-column: 1; grid-row: 2; }
  .frise-seance { grid-column: 1; grid-row: 3; margin-bottom: 0; }
  #alerte-son { grid-column: 2; grid-row: 2; align-self: start; }
  .commandes { grid-column: 2; grid-row: 2 / 4; grid-template-columns: 1fr; align-content: center; }
  .commandes button { min-height: 60px; }
  .commandes .principal { order: -1; }
  #phase, #seance[data-phase="entre"] #phase { font-size: 7vh; }
  #chrono { font-size: min(25vw, 50vh); }
  #chrono.long { font-size: min(20vw, 42vh); }
  #ensuite { margin-top: 8px; font-size: 5.5vh; }
}

/* ---------- Fin ---------- */
#fin {
  position: fixed; inset: 0; background: var(--fin); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
  padding: calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 24px)
           calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 24px);
}
.bravo { font-size: 40px; font-weight: 800; line-height: 1.1; }
#fin-duree { font-size: 21px; margin-bottom: 22px; }
#fin .gros { max-width: 420px; background: #fff; color: #111; }
#fin .secondaire { width: 100%; max-width: 420px; min-height: 56px; border-radius: 16px; background: rgba(0, 0, 0, .25); }
</style>
</head>
<body>
<main id="reglages">
  <h1>Minuteur HIIT</h1>
  <div class="bloc" id="liste"></div>
  <div class="resume">
    <canvas id="frise" aria-hidden="true"></canvas>
    <p class="total">Durée totale&nbsp;: <strong id="total"></strong></p>
    <details id="details">
      <summary>Détail de la séance</summary>
      <ol id="detail"></ol>
    </details>
  </div>
  <div class="bloc son">
    <p class="aide">Les bips se mélangent à ta musique. Pour les entendre, l’iPhone (ou l’iPad) ne doit pas être en mode silencieux.</p>
    <button type="button" class="secondaire" id="tester">Tester le son</button>
  </div>
  <div class="pied"><button type="button" class="gros" id="demarrer">Démarrer</button></div>
</main>

<section id="seance" hidden>
  <div class="haut"><span id="position"></span><span id="reste"></span></div>
  <div class="centre">
    <div id="phase"></div>
    <div id="chrono"></div>
    <div class="barre"><div id="barre-phase"></div></div>
    <div id="ensuite"></div>
    <div id="etat-pause" hidden>EN PAUSE</div>
  </div>
  <div class="frise-seance"><canvas id="frise-seance" aria-hidden="true"></canvas><div id="curseur"></div></div>
  <div id="alerte-son" hidden>Son coupé : touche l’écran pour le remettre</div>
  <div class="commandes">
    <button type="button" id="arreter">Arrêter</button>
    <button type="button" id="pause" class="principal">Pause</button>
    <button type="button" id="passer">Passer</button>
  </div>
</section>

<section id="fin" hidden>
  <div class="bravo">Bravo&nbsp;!</div>
  <div id="fin-duree"></div>
  <button type="button" class="gros" id="recommencer">Recommencer</button>
  <button type="button" class="secondaire" id="retour">Réglages</button>
</section>

<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const el = {
    reglages: $('reglages'), liste: $('liste'), frise: $('frise'), total: $('total'),
    details: $('details'), detail: $('detail'), tester: $('tester'), demarrer: $('demarrer'),
    seance: $('seance'), position: $('position'), reste: $('reste'), phase: $('phase'), chrono: $('chrono'),
    barre: $('barre-phase'), ensuite: $('ensuite'), etatPause: $('etat-pause'), friseSeance: $('frise-seance'),
    curseur: $('curseur'), alerteSon: $('alerte-son'), arreter: $('arreter'), pause: $('pause'), passer: $('passer'),
    fin: $('fin'), finDuree: $('fin-duree'), recommencer: $('recommencer'), retour: $('retour'),
  };
  const NB = ' '; // espace insécable devant « : »

  // ---------- Formats ----------
  function mmss(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function enClair(s) {
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60, morceaux = [];
    if (h) morceaux.push(h + ' h');
    if (m) morceaux.push(m + ' min');
    if (r || !morceaux.length) morceaux.push(r + ' s');
    return morceaux.join(' ');
  }
  const deuxChiffres = n => String(n).padStart(2, '0');

  // ---------- Mémoire du téléphone ----------
  function lire(cle) {
    try { return JSON.parse(localStorage.getItem(cle)); } catch (e) { return null; }
  }
  function stocker(cle, valeur) {
    try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch (e) { /* stockage indisponible */ }
  }
  function effacer(cle) {
    try { localStorage.removeItem(cle); } catch (e) { /* stockage indisponible */ }
  }

  // ---------- Réglages ----------
  const CLE = 'minuteur-hiit:v2';
  const ANCIENNE_CLE = 'minuteur-hiit:v1'; // première version, qui proposait 2 cycles d'office
  const DEFAUT = { precycle: 60, cycles: 5, rounds: 3, effort: 45, repos: 25, entreCycles: 75 };
  const CHAMPS = [
    { cle: 'precycle', nom: 'Précycle', aide: 'avant le premier cycle', type: 'precycle', duree: true, min: 0, max: 1800 },
    { cle: 'cycles', nom: 'Cycles', duree: false, min: 1, max: 99 },
    { cle: 'rounds', nom: 'Rounds par cycle', duree: false, min: 1, max: 99 },
    { cle: 'effort', nom: 'Effort', aide: 'à chaque round', type: 'effort', duree: true, min: 1, max: 1800 },
    { cle: 'repos', nom: 'Repos entre les rounds', aide: 'aucun après le dernier round', type: 'repos', duree: true, min: 0, max: 1800 },
    { cle: 'entreCycles', nom: 'Repos entre les cycles', type: 'entre', duree: true, min: 0, max: 1800 },
  ];

  function borner(v, min, max) {
    v = Math.round(Number(v));
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : null;
  }
  function valider(brut) {
    const r = Object.assign({}, DEFAUT);
    if (brut && typeof brut === 'object') {
      for (const c of CHAMPS) {
        if (brut[c.cle] == null) continue;
        const v = borner(brut[c.cle], c.min, c.max);
        if (v !== null) r[c.cle] = v;
      }
    }
    return r;
  }
  function charger() {
    const brut = lire(CLE);
    if (brut) return valider(brut);
    // Réglages gardés par la première version : ses 2 cycles d'office deviennent les 5 d'aujourd'hui.
    const ancien = lire(ANCIENNE_CLE);
    if (ancien && ancien.cycles === 2) ancien.cycles = DEFAUT.cycles;
    return valider(ancien);
  }
  function enregistrer() { stocker(CLE, reglages); }
  const reglages = charger();

  // ---------- Plan de la séance ----------
  // Précycle, puis chaque cycle : effort, repos, effort, repos… effort (pas de repos après
  // le dernier round), puis le repos entre cycles, sauf après le dernier cycle.
  function construirePlan(r) {
    const phases = [];
    const ajouter = (type, duree, cycle, round) => { if (duree > 0) phases.push({ type, duree, cycle, round }); };
    ajouter('precycle', r.precycle, 1, 0);
    for (let c = 1; c <= r.cycles; c++) {
      for (let k = 1; k <= r.rounds; k++) {
        ajouter('effort', r.effort, c, k);
        if (k < r.rounds) ajouter('repos', r.repos, c, k);
      }
      if (c < r.cycles) ajouter('entre', r.entreCycles, c, r.rounds);
    }
    let t = 0;
    for (const p of phases) { p.debut = t; t += p.duree; p.fin = t; }
    return { phases, total: t, cycles: r.cycles, rounds: r.rounds };
  }
  // Un bip au début de chaque phase, trois bips courts avant la fin de chaque phase, une mélodie à la fin.
  function evenementsSonores(plan) {
    const sons = [];
    for (const p of plan.phases) {
      sons.push({ t: p.debut * 1000, son: p.type });
      for (let s = p.fin - 3; s < p.fin; s++) if (s > p.debut) sons.push({ t: s * 1000, son: 'tic' });
    }
    sons.push({ t: plan.total * 1000, son: 'fin' });
    return sons;
  }

  // ---------- Son ----------
  // Sur iPhone, la session audio « ambient » mélange les bips à la musique des autres applis
  // (Musique, Spotify…) au lieu de la couper ; en contrepartie, elle se tait en mode silencieux.
  // Elle est réglée dès l'ouverture, avant le moindre son.
  const SONS = {
    tic: [[880, 0.12, 0.22]],
    precycle: [[660, 0.3, 0.26]],
    effort: [[1320, 0.55, 0.28]],
    repos: [[587, 0.55, 0.28]],
    entre: [[587, 0.3, 0.28], [440, 0.6, 0.28]],
    fin: [[523, 0.2, 0.28], [659, 0.2, 0.28], [784, 0.2, 0.28], [1047, 0.8, 0.28]],
  };
  let ctx = null;
  const actifs = new Set();

  function reglerSessionAudio() {
    try {
      if ('audioSession' in navigator) navigator.audioSession.type = 'ambient';
    } catch (e) { /* navigateur sans réglage de session audio */ }
  }
  function preparerSon() {
    reglerSessionAudio();
    let reveil = null;
    try {
      if (!ctx) {
        const Contexte = window.AudioContext || window.webkitAudioContext;
        if (!Contexte) return Promise.resolve();
        ctx = new Contexte();
        ctx.onstatechange = majAlerteSon;
      }
      if (ctx.state !== 'running') reveil = ctx.resume();
      // Un son vide joué pendant le toucher déverrouille l'audio des anciens iPhone.
      const vide = ctx.createBufferSource();
      vide.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
      vide.connect(ctx.destination);
      vide.start(0);
    } catch (e) { /* pas de son possible */ }
    majAlerteSon();
    return reveil && reveil.then ? reveil.then(majAlerteSon, majAlerteSon) : Promise.resolve();
  }
  function sonPret() { return !!ctx && ctx.state === 'running'; }
  function jouer(nom, dans) {
    if (!sonPret()) return;
    let t = ctx.currentTime + dans;
    for (const [frequence, duree, volume] of SONS[nom]) {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = frequence;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(volume, t + 0.008);
      gain.gain.setValueAtTime(volume, t + duree - 0.04);
      gain.gain.linearRampToValueAtTime(0, t + duree);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + duree + 0.01);
      actifs.add(osc);
      osc.onended = () => actifs.delete(osc);
      t += duree + 0.04;
    }
  }
  function couperSons() {
    for (const osc of actifs) {
      try { osc.stop(); } catch (e) { /* déjà arrêté */ }
      try { osc.disconnect(); } catch (e) { /* déjà débranché */ }
    }
    actifs.clear();
  }
  // L'iPhone n'accepte de (re)lancer le son que sur un toucher, par exemple quand l'appli
  // a été rouverte au milieu d'une séance : l'alerte invite alors à toucher l'écran.
  function reveillerSon() {
    if (!sonPret()) preparerSon();
  }
  function majAlerteSon() {
    el.alerteSon.hidden = !(seance.boucle && !sonPret());
  }

  // ---------- Écran toujours allumé ----------
  // Tant que l'appli est à l'écran, quel que soit l'écran affiché. Le système rend le verrou
  // quand l'appli passe en arrière-plan : on le redemande au retour. Safari n'accorde le premier
  // verrou que sur un toucher : on le redemande aussi à chaque toucher tant qu'il manque.
  let verrou = null, demandeVerrou = null;
  function garderEcran() {
    if (!('wakeLock' in navigator) || verrou || demandeVerrou || document.visibilityState !== 'visible') return;
    demandeVerrou = navigator.wakeLock.request('screen').then(v => {
      demandeVerrou = null;
      verrou = v;
      v.addEventListener('release', () => { if (verrou === v) verrou = null; });
    }, () => { demandeVerrou = null; });
  }

  // ---------- Séance ----------
  // Le temps écoulé se lit sur l'horloge réelle : il reste juste même si l'iPhone suspend
  // l'appli un moment. Les bips manqués pendant l'absence sont sautés, pas joués en rafale.
  // base : temps déjà écoulé (ms) ; depuis : instant où le chrono est reparti, null en pause.
  // La séance en cours est gardée dans le téléphone : fermer l'appli ne l'arrête pas.
  const AVANCE = 300;     // ms : les bips sont programmés un peu à l'avance sur l'horloge audio
  const RETARD_MAX = 250; // ms : un bip plus en retard que ça est sauté
  const CLE_SEANCE = 'minuteur-hiit:seance';
  const seance = { reglages: null, plan: null, sons: [], base: 0, depuis: null, prochain: 0, boucle: null, journal: [] };
  const NOMS = { precycle: 'Précycle', effort: 'Effort', repos: 'Repos', entre: 'Repos entre cycles' };

  function ecoule() { return Math.max(0, seance.base + (seance.depuis === null ? 0 : Date.now() - seance.depuis)); }
  function sauverSeance() { stocker(CLE_SEANCE, { reglages: seance.reglages, base: seance.base, depuis: seance.depuis }); }
  function indexPhase(ms) {
    const phases = seance.plan.phases;
    let bas = 0, haut = phases.length - 1;
    while (bas < haut) {
      const milieu = (bas + haut + 1) >> 1;
      if (phases[milieu].debut * 1000 <= ms) bas = milieu; else haut = milieu - 1;
    }
    return bas;
  }
  function recaler(ms) {
    let i = 0;
    while (i < seance.sons.length && seance.sons[i].t < ms) i++;
    seance.prochain = i;
  }
  function annulerSons(ms) {
    couperSons();
    seance.journal = seance.journal.filter(e => e.t <= ms);
  }
  function programmerSons(ms) {
    if (seance.depuis === null) return;
    const sons = seance.sons;
    while (seance.prochain < sons.length && sons[seance.prochain].t < ms + AVANCE) {
      const s = sons[seance.prochain];
      const delai = s.t - ms;
      if (delai < -RETARD_MAX) { seance.prochain++; continue; }
      if (!sonPret()) break;
      seance.prochain++;
      jouer(s.son, Math.max(0, delai) / 1000);
      seance.journal.push({ t: s.t, son: s.son });
    }
  }

  function ecrire(noeud, texte) { if (noeud.textContent !== texte) noeud.textContent = texte; }
  function positionTexte(p, plan) {
    if (p.type === 'precycle') return 'Avant le cycle 1/' + plan.cycles;
    if (p.type === 'entre') return 'Avant le cycle ' + (p.cycle + 1) + '/' + plan.cycles;
    return 'Cycle ' + p.cycle + '/' + plan.cycles + ' · Round ' + p.round + '/' + plan.rounds;
  }
  function ensuiteTexte(plan, i) {
    const suivante = plan.phases[i + 1];
    if (!suivante) return 'Ensuite' + NB + ': fin de la séance';
    return 'Ensuite' + NB + ': ' + NOMS[suivante.type].toLowerCase() + ' ' + mmss(suivante.duree);
  }
  function afficher(ms) {
    const plan = seance.plan, i = indexPhase(ms), p = plan.phases[i];
    const resteMs = Math.max(0, p.fin * 1000 - ms);
    const chrono = mmss(Math.ceil(resteMs / 1000));
    ecrire(el.chrono, chrono);
    el.chrono.classList.toggle('long', chrono.length > 4);
    ecrire(el.phase, NOMS[p.type]);
    if (el.seance.dataset.phase !== p.type) el.seance.dataset.phase = p.type;
    ecrire(el.position, positionTexte(p, plan));
    ecrire(el.ensuite, ensuiteTexte(plan, i));
    ecrire(el.reste, 'Reste ' + mmss(Math.ceil(Math.max(0, plan.total * 1000 - ms) / 1000)));
    el.barre.style.transform = 'scaleX(' + (1 - resteMs / (p.duree * 1000)).toFixed(4) + ')';
    el.curseur.style.setProperty('--f', (ms / (plan.total * 1000)).toFixed(5));
  }
  function tick() {
    if (!seance.boucle) return;
    const ms = ecoule();
    programmerSons(ms);
    if (ms >= seance.plan.total * 1000) terminer(); else afficher(ms);
  }

  function lancerSeance(r, base, depuis) {
    couperSons();
    seance.reglages = r;
    seance.plan = construirePlan(r);
    seance.sons = evenementsSonores(seance.plan);
    seance.journal = [];
    seance.base = base;
    seance.depuis = depuis;
    recaler(base); // les bips déjà passés seront sautés au premier tic, sans être joués
    majPause();
    desarmerArret();
    montrer('seance');
    dessinerFrise(el.friseSeance, seance.plan);
    clearInterval(seance.boucle);
    seance.boucle = setInterval(tick, 50);
    garderEcran();
    majAlerteSon();
    tick();
  }
  function demarrer() {
    preparerSon();
    lancerSeance(Object.assign({}, reglages), 0, Date.now());
    sauverSeance();
  }
  // À la réouverture de l'appli : la séance reprend là où l'horloge réelle l'a menée,
  // ou l'écran de fin s'affiche si elle s'est terminée entre-temps.
  function reprendreSeance() {
    const s = lire(CLE_SEANCE);
    if (!s || typeof s !== 'object' || !s.reglages) return;
    const base = Number(s.base), depuis = s.depuis === null ? null : Number(s.depuis);
    if (!Number.isFinite(base) || base < 0 || (depuis !== null && !Number.isFinite(depuis))) { effacer(CLE_SEANCE); return; }
    lancerSeance(valider(s.reglages), base, depuis);
  }
  function majPause() {
    const enPause = seance.depuis === null;
    el.seance.classList.toggle('pause', enPause);
    el.etatPause.hidden = !enPause;
    el.pause.textContent = enPause ? 'Reprendre' : 'Pause';
  }
  function basculerPause() {
    if (!seance.boucle) return;
    if (seance.depuis === null) {
      preparerSon();
      seance.depuis = Date.now();
      recaler(seance.base);
    } else {
      const ms = ecoule();
      seance.base = ms;
      seance.depuis = null;
      annulerSons(ms);
    }
    sauverSeance();
    majPause();
    tick();
  }
  function passer() {
    if (!seance.boucle) return;
    const ms = ecoule();
    annulerSons(ms);
    seance.base = seance.plan.phases[indexPhase(ms)].fin * 1000;
    if (seance.depuis !== null) seance.depuis = Date.now();
    sauverSeance();
    recaler(seance.base);
    tick();
  }
  let arretArme = null;
  function desarmerArret() {
    clearTimeout(arretArme);
    arretArme = null;
    el.arreter.textContent = 'Arrêter';
    el.arreter.classList.remove('arme');
  }
  function arreter() {
    if (!seance.boucle) return;
    if (!arretArme) { // premier toucher : on demande confirmation pendant 3 secondes
      el.arreter.textContent = 'Arrêter ?';
      el.arreter.classList.add('arme');
      arretArme = setTimeout(desarmerArret, 3000);
      return;
    }
    desarmerArret();
    annulerSons(ecoule());
    clearInterval(seance.boucle);
    seance.boucle = null;
    effacer(CLE_SEANCE);
    majAlerteSon();
    montrer('reglages');
    majReglages();
  }
  function terminer() {
    clearInterval(seance.boucle);
    seance.boucle = null;
    effacer(CLE_SEANCE);
    desarmerArret();
    majAlerteSon();
    ecrire(el.finDuree, 'Séance terminée · ' + enClair(seance.plan.total));
    montrer('fin');
  }
  function montrer(id) {
    for (const ecran of [el.reglages, el.seance, el.fin]) ecran.hidden = ecran.id !== id;
    window.scrollTo(0, 0);
  }

  // ---------- Écran des réglages ----------
  function valeursPossibles(c) {
    const valeurs = [];
    if (!c.duree) { for (let n = c.min; n <= c.max; n++) valeurs.push(n); return valeurs; }
    for (let s = 0; s <= c.max; s += s < 60 ? 1 : 5) if (s >= c.min) valeurs.push(s);
    return valeurs;
  }
  function etiquette(c, v) { return c.duree ? mmss(v) : String(v); }
  function pas(c, v, sens) {
    if (!c.duree) return v + sens;
    return sens > 0 ? Math.floor(v / 5) * 5 + 5 : Math.ceil(v / 5) * 5 - 5;
  }
  function changer(c, v) {
    v = borner(v, c.min, c.max);
    if (v === null || v === reglages[c.cle]) return;
    reglages[c.cle] = v;
    enregistrer();
    majReglages();
  }
  // Toucher : un pas ; garder le doigt appuyé : les pas s'enchaînent.
  function repeter(bouton, action) {
    let attente = null, rythme = null;
    const stop = () => { clearTimeout(attente); clearInterval(rythme); };
    bouton.addEventListener('pointerdown', e => {
      if (e.button) return;
      e.preventDefault();
      stop();
      action();
      attente = setTimeout(() => { rythme = setInterval(action, 100); }, 450);
    });
    for (const fin of ['pointerup', 'pointercancel', 'pointerleave']) bouton.addEventListener(fin, stop);
    bouton.addEventListener('click', e => { if (e.detail === 0) action(); }); // clavier, VoiceOver
  }
  function construireLignes() {
    for (const c of CHAMPS) {
      const ligne = document.createElement('div');
      ligne.className = 'ligne';
      ligne.dataset.champ = c.cle;
      ligne.innerHTML =
        '<div class="nom">' + (c.type ? '<i class="puce" style="background:var(--' + c.type + ')"></i>' : '') +
        c.nom + (c.aide ? '<small>' + c.aide + '</small>' : '') + '</div>' +
        '<div class="reglage">' +
        '<button type="button" class="pas moins" aria-label="' + c.nom + ' : moins">−</button>' +
        '<label class="valeur"><span></span><select aria-label="' + c.nom + '"></select></label>' +
        '<button type="button" class="pas plus" aria-label="' + c.nom + ' : plus">+</button>' +
        '</div>';
      c.texte = ligne.querySelector('.valeur span');
      c.select = ligne.querySelector('select');
      c.select.innerHTML = valeursPossibles(c).map(v => '<option value="' + v + '">' + etiquette(c, v) + '</option>').join('');
      repeter(ligne.querySelector('.moins'), () => changer(c, pas(c, reglages[c.cle], -1)));
      repeter(ligne.querySelector('.plus'), () => changer(c, pas(c, reglages[c.cle], +1)));
      c.select.addEventListener('change', () => changer(c, c.select.value));
      el.liste.appendChild(ligne);
    }
  }
  function majReglages() {
    for (const c of CHAMPS) {
      const v = reglages[c.cle];
      ecrire(c.texte, etiquette(c, v));
      c.select.value = String(v);
      if (c.select.value !== String(v)) { // valeur hors de la liste : on l'y range à sa place
        const suivante = [...c.select.options].find(o => Number(o.value) > v);
        c.select.add(new Option(etiquette(c, v), String(v)), suivante || null);
        c.select.value = String(v);
      }
    }
    const plan = construirePlan(reglages);
    ecrire(el.total, enClair(plan.total));
    dessinerFrise(el.frise, plan);
    if (el.details.open) remplirDetail();
  }
  function remplirDetail() {
    const r = reglages, lignes = [], rounds = [];
    for (let k = 1; k <= r.rounds; k++) {
      rounds.push('Round ' + deuxChiffres(k) + NB + ': ' + mmss(r.effort) + ' d’effort' +
        (k < r.rounds && r.repos > 0 ? ' puis ' + mmss(r.repos) + ' de repos' : '') + '.');
    }
    if (r.precycle > 0) lignes.push('<li><b>Précycle</b>' + NB + ': ' + mmss(r.precycle) + '</li>');
    for (let c = 1; c <= r.cycles; c++) {
      lignes.push('<li><b>Cycle ' + deuxChiffres(c) + '</b>' + NB + ': ' + rounds.join(' ') + '</li>');
      if (c < r.cycles && r.entreCycles > 0) lignes.push('<li><b>Repos entre cycles</b>' + NB + ': ' + mmss(r.entreCycles) + '</li>');
    }
    lignes.push('<li><b>Fin</b></li>');
    el.detail.innerHTML = lignes.join('');
  }
  function dessinerFrise(canvas, plan) {
    const largeur = canvas.clientWidth, hauteur = canvas.clientHeight;
    if (!largeur || !hauteur) return;
    const echelle = Math.min(3, window.devicePixelRatio || 1);
    canvas.width = Math.round(largeur * echelle);
    canvas.height = Math.round(hauteur * echelle);
    const g = canvas.getContext('2d');
    g.setTransform(echelle, 0, 0, echelle, 0, 0);
    g.clearRect(0, 0, largeur, hauteur);
    const style = getComputedStyle(document.documentElement), couleurs = {};
    for (const type of Object.keys(NOMS)) couleurs[type] = style.getPropertyValue('--' + type).trim();
    const ecart = plan.phases.length * 3 < largeur ? 1 : 0; // fin trait entre les phases s'il y a la place
    for (const p of plan.phases) {
      g.fillStyle = couleurs[p.type];
      g.fillRect((p.debut / plan.total) * largeur, 0, Math.max(0.5, (p.duree / plan.total) * largeur - ecart), hauteur);
    }
  }

  // ---------- Branchements ----------
  el.demarrer.addEventListener('click', demarrer);
  el.recommencer.addEventListener('click', demarrer);
  el.retour.addEventListener('click', () => { montrer('reglages'); majReglages(); });
  el.pause.addEventListener('click', basculerPause);
  el.passer.addEventListener('click', passer);
  el.arreter.addEventListener('click', arreter);
  el.tester.addEventListener('click', () => { preparerSon().then(() => jouer('effort', 0.02)); });
  el.details.addEventListener('toggle', () => { if (el.details.open) remplirDetail(); });
  el.seance.addEventListener('click', reveillerSon);
  document.addEventListener('click', garderEcran);
  document.addEventListener('touchend', garderEcran, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    garderEcran();
    if (!seance.boucle) return;
    const ms = ecoule();
    annulerSons(ms);
    if (seance.depuis !== null) recaler(ms);
    reveillerSon();
    tick();
  });
  window.addEventListener('resize', () => {
    if (!el.reglages.hidden) dessinerFrise(el.frise, construirePlan(reglages));
    if (!el.seance.hidden && seance.plan) dessinerFrise(el.friseSeance, seance.plan);
  });
  document.addEventListener('touchstart', () => {}, { passive: true }); // rend :active effectif sur iPhone

  reglerSessionAudio();
  construireLignes();
  majReglages();
  reprendreSeance();
  garderEcran();
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Pour les essais automatiques.
  window.HIIT = {
    construirePlan, evenementsSonores, mmss, enClair,
    get journal() { return seance.journal.map(e => Object.assign({}, e)); },
    get etatSon() { return ctx ? ctx.state : 'absent'; },
  };
})();
</script>
</body>
</html>
